<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>agent-demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f5f5f7;
      display: flex;
      justify-content: center;
      height: 100vh;
    }
    .app {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      background: #fff;
    }
    header {
      padding: 14px 18px;
      border-bottom: 1px solid #e5e5ea;
      font-weight: 600;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user { align-self: flex-end; background: #0a84ff; color: #fff; }
    .agent { align-self: flex-start; background: #f0f0f2; color: #1c1c1e; }
    .tool {
      align-self: flex-start;
      font-size: 12px;
      color: #6b6b70;
      background: #fafafa;
      border: 1px dashed #d1d1d6;
      border-radius: 10px;
      padding: 6px 10px;
      white-space: pre-wrap;
    }
    form {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid #e5e5ea;
    }
    input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #d1d1d6;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #0a84ff; }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #0a84ff;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header>agent-demo</header>
    <div id="chat"></div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="输入消息..." autofocus />
      <button id="send" type="submit">发送</button>
    </form>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    let sessionId = null;

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function scrollDown() {
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      input.disabled = true;
      send.disabled = true;
      addMessage("user", text);
      const agentDiv = addMessage("agent", "");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });
        if (!res.ok || !res.body) throw new Error("HTTP " + res.status);

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let pending = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          pending += decoder.decode(value, { stream: true });
          const parts = pending.split("\n\n");
          pending = parts.pop();

          for (const part of parts) {
            const line = part.trim();
            if (!line.startsWith("data:")) continue;
            const data = JSON.parse(line.slice(5).trim());

            if (data.type === "session") {
              sessionId = data.session_id;
            } else if (data.type === "text") {
              agentDiv.textContent += data.content;
              scrollDown();
            } else if (data.type === "tool") {
              addMessage("tool", "调用工具: " + data.name + "(" + data.arguments + ")");
              scrollDown();
            } else if (data.type === "tool_result") {
              addMessage("tool", "结果: " + data.content);
              scrollDown();
            } else if (data.type === "error") {
              agentDiv.textContent += "\n[错误] " + data.message;
            }
          }
        }
      } catch (err) {
        agentDiv.textContent += "\n[错误] " + err.message;
      } finally {
        input.disabled = false;
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
